# GEM1 main pipeline environment (Steps 1-2, 6-13, and all audit/ scripts).
# NOT for Step 3 (context-specific model extraction) -- that requires the
# separate environment-troppo.yml (see that file and README.md for why).
#
# Package list and versions below are the VERIFIED output of
# `pip list --format=freeze` run directly against the actual working conda
# environment used to produce every result in this repository (env name
# locally: "GEM1"; re-verified at Phase 11 of release preparation, matches
# the same inspection from Phase 4). Nothing here is inferred or guessed.
# Python version verified via `python --version`: 3.12.13.
name: gem1-main
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - cobra==0.31.1
      - numpy==2.5.1
      - pandas==2.3.3
      - scipy==1.18.0
      - matplotlib==3.11.0
      - scikit-learn==1.9.0
      - statsmodels==0.14.6
      - GEOparse==2.0.4
      - plotly==6.9.0
      - openpyxl==3.1.5
      - networkx==3.6.1
      - python-libsbml==5.21.1
      - Escher==1.8.1
      - jupyter==1.1.1
      - ipykernel==7.3.0
      # Optional: Gurobi acceleration for the MILP-based steps this env
      # touches indirectly (audit item6/item13 re-verification scripts use
      # Gurobi where available). The pipeline itself is documented to run
      # on GLPK (bundled with cobra) if no Gurobi license is present --
      # untested without Gurobi in this repository's actual working history,
      # so treat GLPK fallback as expected-to-work by design, not verified.
      - gurobipy==13.0.2
